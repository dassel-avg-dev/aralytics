# Development profile: schema migrations plus Swagger UI. Demo data requires the
# separate `seed` profile (`SPRING_PROFILES_ACTIVE=dev,seed`). Never use in production.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/aralytics?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: "" 
  jpa:
    show-sql: false
    properties:
      hibernate:
        # XAMPP MariaDB rejects Hibernate's MySQL CAST(? AS JSON) on quiz create.
        dialect: org.hibernate.dialect.MariaDBDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

aralytics:
  password-reset:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    ph.aralytics.backend: DEBUG
    org.flywaydb: INFO