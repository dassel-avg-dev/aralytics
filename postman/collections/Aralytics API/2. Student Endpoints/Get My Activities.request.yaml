$kind: http-request
url: "{{baseUrl}}/api/student/activities"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{studentToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 2000
