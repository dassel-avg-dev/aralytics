$kind: http-request
description: Public endpoint. Validates a school activation key and returns a short-lived activation token (no account is created).
url: "{{baseUrl}}/api/auth/verify-key"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "institutionCode": "STJUDE-MNL-2025",
      "accessKey": "KEY-8821-PY",
      "role": "STUDENT"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('activation token returned', function () {
          pm.expect(pm.response.json().activationToken).to.be.a('string').and.not.empty;
      });
    language: text/javascript
order: 3000
